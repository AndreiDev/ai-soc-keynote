<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ten million sign-ins</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/ui.css">
<style>
html,body{height:100%;overflow:hidden}
body{min-height:0;background:var(--ground)}
.cmp{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
/* component header */
.ch{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-bottom:1px solid #1C222B;min-width:0}
.ci{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(160deg,#0F2230,#0B151D);border:1px solid rgba(127,214,238,.35);color:#7FD6EE}
.ch h1{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ctx{font:500 11px var(--mono);color:var(--text2);flex:none}
.cs{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);white-space:nowrap;flex:none}
.cs .dot{width:8px;height:8px}
.cs .dot.load{color:var(--sus)} .cs .dot.ok{color:var(--ben)}
.eng{flex:none;height:24px;font-size:11.5px;gap:5px;font-variant-numeric:tabular-nums}
.eng b{font:600 11.5px var(--mono);color:#CFE0FF}
/* body */
.cb{position:relative;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,29vw,400px);gap:12px;padding:12px;min-height:0}
.sw-wrap{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.ctrl{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:9px 14px;border-bottom:1px solid #1C222B}
.ctrl .lab{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 11px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--text3);font-size:12px;cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:#1A2230;color:var(--text)}
.seg .s{display:none}
.leg{margin-left:auto;display:flex;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--text3);white-space:nowrap}
.ramp{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#0E2633,#16506A,#2F93B5,#7FD6EE,#F2FBFF)}
.hm{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:104px minmax(0,1fr) 16px;grid-template-rows:24px minmax(0,1fr) 10px}
.hm-top{grid-column:2;grid-row:1;position:relative;border-bottom:1px solid #1C222B}
.hm-left{grid-column:1;grid-row:2;position:relative;border-right:1px solid #1C222B}
.hm-plot{grid-column:2;grid-row:2;position:relative;background:#0A0D11;touch-action:none}
.hm-plot canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#ov{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;overflow:visible;z-index:2}
.dlab{position:absolute;right:9px;transform:translateY(-50%);font-size:11.5px;color:var(--text2);text-align:right;white-space:nowrap;line-height:1.25}
.dlab small{display:block;font:500 10px var(--mono);color:var(--text3)}
.tick{position:absolute;bottom:5px;transform:translateX(-50%);font:500 10.5px var(--mono);color:var(--text3);white-space:nowrap}
.counter{position:absolute;left:14px;top:12px;z-index:3;display:flex;flex-direction:column;gap:2px;padding:10px 14px 11px;border-radius:12px;background:rgba(10,13,17,.84);border:1px solid rgba(127,214,238,.22);box-shadow:0 12px 30px rgba(0,0,0,.45);pointer-events:none;opacity:0}
.counter b{font:600 34px/1 var(--mono);letter-spacing:-.02em;color:#E8F7FF;font-variant-numeric:tabular-nums}
.counter span{font-size:12px;color:var(--text2)}
.counter i{display:block;height:3px;border-radius:2px;background:#1A2733;margin-top:6px;overflow:hidden}
.counter i em{display:block;height:100%;width:0;background:linear-gradient(90deg,#2F93B5,#7FD6EE)}
.tip{position:absolute;z-index:6;pointer-events:none;max-width:290px;padding:8px 10px;border-radius:8px;background:#141A22;border:1px solid var(--line2);box-shadow:0 10px 26px rgba(0,0,0,.45);font-size:12px;opacity:0;transition:opacity .1s}
.loading{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0A0D11;font-size:12.5px;color:var(--text2)}
.loading .pbar{width:240px;height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.loading .pbar i{display:block;height:100%;width:0;background:#7FD6EE}
/* captions */
.cap{position:absolute;left:50%;bottom:22px;z-index:8;transform:translateX(-50%);max-width:calc(100% - 32px);padding:9px 16px 10px;border-radius:12px;background:rgba(10,13,17,.86);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 12px 34px rgba(0,0,0,.45);font-size:15.5px;line-height:1.35;font-weight:500;color:var(--text);text-align:center;white-space:nowrap;pointer-events:none;opacity:0}
.cap .pg{position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:1px;background:rgba(255,255,255,.07);overflow:hidden}
.cap .pg i{display:block;height:100%;width:0;background:rgba(232,235,239,.38)}
.hint{position:absolute;left:50%;bottom:22px;z-index:8;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(10,13,17,.9);border:1px solid var(--line2);font-size:12px;color:var(--text2);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .4s}
body.nocap .cap{display:none}
/* query panel */
.qp{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph2{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #1C222B;min-height:44px}
.ph2 h2{font-size:13px;font-weight:600;white-space:nowrap}
.ph2 .btn{margin-left:auto}
.qb{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.qe{padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.qe .lead{font-size:13.5px;line-height:1.45;color:var(--text)}
.qe .lead span{color:var(--text3)}
.spot{border-top:1px solid #1C222B;padding-top:12px}
.sp{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1A2029;font-size:12.5px}
.sp .t3{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp b{font-weight:600;min-width:20px;text-align:right}
.qe .glyph{width:100%;height:84px;border-radius:10px;border:1px dashed #2C3540;display:grid;place-items:center;color:var(--text3);font-size:12px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 8px,transparent 8px 16px)}
.kv2{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 12px;font-size:12.5px;margin:0}
.kv2 dt{color:var(--text3)} .kv2 dd{margin:0;min-width:0}
.qsel{padding:12px 14px 10px}
.sqlw{position:relative;padding:0 14px;flex:0 1 auto;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 calc(100% - 18px),transparent);mask-image:linear-gradient(#000 calc(100% - 18px),transparent)}
.sqlw.fits{-webkit-mask-image:none;mask-image:none}
.code{font-size:11px;line-height:1.6;padding:10px 12px;white-space:pre-wrap;word-break:break-word;min-height:0}
.caret{display:inline-block;width:7px;height:13px;margin-left:1px;vertical-align:-2px;background:#7FD6EE}
.res{flex:none;padding:10px 14px 0}
.rh{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:600;margin-bottom:4px}
.rh .t3{font-weight:400;font-size:11.5px;margin-left:auto}
.utbl td{font-size:12.5px;padding:6px 8px;border-bottom:1px solid #1A2029}
.utbl tr td:first-child{padding-left:0}
.utbl tr td:last-child{padding-right:0;text-align:right}
.utbl .ct{font:600 13px var(--mono);text-align:right}
.utbl tr.rvh{opacity:0}
.qf{flex:none;margin-top:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid #1C222B}
.qf .t3{font-size:11.5px;margin-left:auto}
/* ghost + fade */
.ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;opacity:0;will-change:transform}
.ghost svg{display:block;transform:scale(1.12);transform-origin:2px 2px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.ghost .rip{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:2px solid rgba(232,235,239,.9);opacity:0}
.fade{position:absolute;inset:0;z-index:30;background:var(--ground);opacity:0;pointer-events:none}
@media (max-width:1460px){ .ctrl .hint2{display:none} }
@media (max-width:1180px){ #sel-chip,.leg .lx{display:none} .code{font-size:10.5px} }
@media (max-width:1100px){ .seg button{padding:0 8px;font-size:11.5px} .ramp{width:80px} }
@media (max-height:700px){
  .ch{height:44px}
  .cb{padding:10px;gap:10px}
  .ctrl{padding:7px 12px}
  .seg button{height:26px}
  .qsel{padding:8px 12px 6px}
  .qsel .kv2 > :nth-child(n+3){display:none}
  .code{font-size:10.5px;padding:8px 10px;line-height:1.5}
  .sqlw{padding:0 12px}
  .res{padding:8px 12px 0}
  .qf{padding:7px 12px}
  .qf .t3{display:none}
  .cap{font-size:14px;bottom:18px}
  .counter b{font-size:28px}
}
@media (max-width:720px){
  .ch{height:44px;padding:0 12px;gap:8px}
  .ch h1{font-size:13.5px}
  .ch h1 .x,.ctx{display:none}
  .eng{font-size:10.5px;padding:0 6px}
  .eng .x,#st{display:none}
  .cb{grid-template-columns:1fr;grid-template-rows:minmax(0,47fr) minmax(0,53fr);padding:8px;gap:8px}
  .ctrl{padding:6px 8px;gap:6px}
  .ctrl .lab,.leg{display:none}
  .seg{width:100%}
  .seg button{flex:1;padding:0 4px;font-size:11.5px}
  .seg .l{display:none} .seg .s{display:inline}
  .hm{grid-template-columns:62px minmax(0,1fr) 10px}
  .dlab{font-size:10px;right:6px}
  .counter{left:8px;top:8px;padding:7px 10px}
  .counter b{font-size:22px}
  .cap{font-size:12.5px;white-space:normal;width:calc(100% - 20px);bottom:16px;padding:7px 10px 9px}
  .qsel .kv2 > :nth-child(n+3){display:none}
  .code{font-size:10px;line-height:1.5;padding:8px 10px}
  .qe .glyph{display:none}
  .qf .t3{display:none}
}
</style>
</head>

const LIVEV = { brush: null };
function liveRender() {
  ovFrame = { flare: 1, brush: LIVEV.brush ? { ...LIVEV.brush } : drag ? null : null };
  if (drag) ovFrame.brush = { ...drag.cells, live: true };
  renderOverlay();
  renderPanel({ brush: LIVEV.brush, typed: Infinity, rows: 5, caret: false });
  renderEngine(N_EVENTS, S.ms, false);
}
function setMetric(m) { S.metric = m; S.f = 1; setMetricUI(m); LIVEV.brush = LIVEV.brush ? { ...LIVEV.brush } : null; requestBins(m, 1); liveRender(); }
let drag = null;
const toCell = (x, y) => ({ c: clamp(Math.floor(x / PW * TB), 0, TB - 1), rr: clamp(Math.floor(y / PH * R), 0, R - 1) });
/* what a pixel shows is the hottest bin under it (max-pooling), so hover and click resolve to that cell, within 2 px */
function hotCell(x, y, tol = 2) {
  const r0 = clamp(Math.floor((y - tol) / PH * R), 0, R - 1), r1 = clamp(Math.ceil((y + tol + 1) / PH * R), r0 + 1, R);
  const c0 = clamp(Math.floor((x - tol) / PW * TB), 0, TB - 1), c1 = clamp(Math.ceil((x + tol + 1) / PW * TB), c0 + 1, TB);
  const own = toCell(x, y); let best = { rr: own.rr, c: own.c, v: S.bins ? S.bins[own.rr * TB + own.c] : 0 };
  if (S.bins) for (let rr = r0; rr < r1; rr++) { const o = rr * TB; for (let c = c0; c < c1; c++) { const v = S.bins[o + c]; if (v > best.v) best = { rr, c, v }; } }
  return best;
}
ov.addEventListener('pointerdown', e => { if (!S.bins || CTRL.mode !== 'live') return; const r = plot.getBoundingClientRect(); const a = toCell(e.clientX - r.left, e.clientY - r.top); drag = { a, x0: e.clientX, y0: e.clientY, cells: { r0: a.rr, r1: a.rr, c0: a.c, c1: a.c } }; ov.setPointerCapture(e.pointerId); tip.style.opacity = 0; });
ov.addEventListener('pointermove', e => {
  if (CTRL.mode !== 'live' || !S.bins) return;
  const r = plot.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, b = toCell(x, y);
  if (drag) { drag.cells = { r0: Math.min(drag.a.rr, b.rr), r1: Math.max(drag.a.rr, b.rr), c0: Math.min(drag.a.c, b.c), c1: Math.max(drag.a.c, b.c) }; liveRender(); return; }
  const h = hotCell(x, y), u = USERS[h.rr], v = h.v, perPx = Math.max(1, Math.round(R / PH)); b.rr = h.rr; b.c = h.c;
  tip.innerHTML = `<div class="row" style="gap:6px"><b class="mono">${esc(u.name)}</b><span class="t3">${esc(DEPTS[u.dept].name)}</span></div><div class="mono t2" style="margin:3px 0">${fmtBin(b.c)} UTC</div><div><b class="mono">${v}</b> ${esc(METRIC[S.metric])}</div>${perPx > 1 ? `<div class="t3" style="font-size:11px;margin-top:3px">each pixel shows the hottest of ~${perPx} identities</div>` : ''}`;
  tip.style.left = Math.max(4, Math.min(PW - 296, x + 14)) + 'px'; tip.style.top = Math.max(4, Math.min(PH - 92, y + 14)) + 'px'; tip.style.opacity = 1;
});
ov.addEventListener('pointerleave', () => { tip.style.opacity = 0; });
ov.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null;
  const click = Math.abs(e.clientX - d.x0) < 4 && Math.abs(e.clientY - d.y0) < 4;
  if (click) { const r = plot.getBoundingClientRect(), h = hotCell(e.clientX - r.left, e.clientY - r.top); LIVEV.brush = { r0: h.rr, r1: h.rr, c0: Math.max(0, h.c - 3), c1: Math.min(TB - 1, h.c + 3) }; }
  else { const [r0, r1] = snapRows(d.cells.r0, d.cells.r1); LIVEV.brush = { r0, r1, c0: d.cells.c0, c1: d.cells.c1 }; }
  liveRender();
});
document.querySelectorAll('#metric button').forEach(b => b.addEventListener('click', () => { if (CTRL.mode === 'live') setMetric(+b.dataset.v); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && LIVEV.brush && CTRL.mode === 'live') { LIVEV.brush = null; liveRender(); } });

/* =====================================================================
   Loop controller: attract loop, take-over, idle resume, embedding
   ===================================================================== */
const CTRL = { t: 0, mode: 'loop', playing: !RM, ext: false, hidden: document.hidden, raf: 0, last: 0, lastInput: 0, resumeAt: 0, ready: false };
function running() { return CTRL.ready && !CTRL.ext && !CTRL.hidden && (CTRL.mode === 'live' || CTRL.playing); }
function schedule(fromTick) { if (!CTRL.raf && running()) { if (!fromTick) CTRL.last = performance.now(); CTRL.raf = requestAnimationFrame(tick); } }
function stop() { if (CTRL.raf) cancelAnimationFrame(CTRL.raf); CTRL.raf = 0; }
function tick() {
  CTRL.raf = 0; const now = performance.now();
  const dt = Math.min(0.1, Math.max(0, (now - CTRL.last) / 1000)); CTRL.last = now;
  if (CTRL.mode === 'loop' && CTRL.playing) { let t = CTRL.t + dt; if (t >= L) t -= L; CTRL.t = t; applyFrame(t, false); }
  else if (CTRL.mode === 'live') {
    if (CTRL.resumeAt) { const k = (now - CTRL.resumeAt) / 500; $('#fade').style.opacity = clamp(k, 0, 1).toFixed(3); if (k >= 1) { CTRL.resumeAt = 0; CTRL.mode = 'loop'; CTRL.playing = true; LIVEV.brush = null; seekCore(0); } }
    else if (!RM && now - CTRL.lastInput > IDLE_MS) CTRL.resumeAt = now;
  }
  schedule(true);
}
function seekCore(t) { CTRL.t = clamp(+t || 0, 0, L - 1e-6); panelMemo = ''; curSel = null; applyFrame(CTRL.t, true); }
function enterLive() {
  if (CTRL.mode === 'live') return;
  CTRL.mode = 'live'; CTRL.resumeAt = 0;
  $('#cap').style.opacity = 0; $('#ghost').style.opacity = 0; $('#fade').style.opacity = 0; $('#counter').style.opacity = 0;
  const cv = plot.querySelector('canvas'); if (cv) cv.style.opacity = '1';
  // finish the stream instantly and keep what is on screen
  const b = ovFrame.brush && ovFrame.brush.snapped ? ovFrame.brush : null;
  LIVEV.brush = b ? { r0: b.r0, r1: b.r1, c0: b.c0, c1: b.c1 } : null;
  if (S.f < 1) { S.f = 1; requestBins(S.metric, 1); }
  setStatus('Live · 14 days', true);
  liveRender();
  const h = $('#hint'); h.style.opacity = 1; clearTimeout(enterLive.t); enterLive.t = setTimeout(() => { h.style.opacity = 0; }, 2600);
  schedule();
}
function input() { CTRL.lastInput = performance.now(); if (CTRL.resumeAt) { CTRL.resumeAt = 0; $('#fade').style.opacity = 0; } if (CTRL.mode !== 'live' && CTRL.ready) enterLive(); else schedule(); }
for (const ev of ['pointerdown', 'wheel', 'keydown', 'touchstart']) addEventListener(ev, input, { capture: true, passive: true });
let lastPM = null;
addEventListener('pointermove', e => { if (lastPM && Math.hypot(e.clientX - lastPM[0], e.clientY - lastPM[1]) > 3) input(); lastPM = [e.clientX, e.clientY]; }, { capture: true, passive: true });
addEventListener('message', e => { const d = e.data; if (!d || typeof d !== 'object') return;
  if (d.corvid === 'pause') { CTRL.ext = true; stop(); }
  else if (d.corvid === 'play') { CTRL.ext = false; if (CTRL.mode === 'loop' && !RM) CTRL.playing = true; schedule(); } });
document.addEventListener('visibilitychange', () => { CTRL.hidden = document.hidden; if (CTRL.hidden) stop(); else schedule(); });
window.__burstXY = i => S.bursts[i] ? cellXY(S.bursts[i].r, S.bursts[i].c) : null;
window.__seek = t => { if (!CTRL.ready) { CTRL.pendingSeek = t; return; } stop(); CTRL.mode = 'loop'; CTRL.playing = false; CTRL.resumeAt = 0; seekCore(t); };
window.__play = () => { CTRL.ext = false; if (CTRL.mode !== 'loop') { CTRL.mode = 'loop'; seekCore(CTRL.t); } CTRL.playing = true; schedule(); };
window.__state = () => ({ t: CTRL.t, mode: CTRL.mode, playing: CTRL.playing, running: !!CTRL.raf, ext: CTRL.ext, engine: GPU ? 'gpu' : 'cpu', metric: S.metric, f: S.f, binsKey: S.binsKey, ms: S.ms, max: S.max,
  bursts: S.bursts.map(b => `${b.name} ${b.v}`), brush: LIVEV.brush, sel: curSel ? { total: curSel.total, top: curSel.top.map(p => `${USERS[p.rr].name} ${p.v}`), sql: curSel.sql } : null, count: $('#eng-n').textContent, busy: window.__busy() });

/* resize */
let rsT = 0;
new ResizeObserver(() => { clearTimeout(rsT); rsT = setTimeout(() => {
  measure(); renderAxes(); if (!CTRL.ready) { renderOverlay(); return; }
  if (GPU && S.binsKey) GPU.draw(); else if (S.bins) drawCPU(S.bins);
  panelMemo = ''; if (CTRL.mode === 'loop') applyFrame(CTRL.t, false); else liveRender();
}, 100); }).observe(plot);

/* boot */
measure(); renderAxes(); renderOverlay(); renderPanel({ brush: null }); setStatus('Loading', false); renderEngine(0, null, true);
try {
  const wantGPU = !!navigator.gpu && !qs.has('cpu');
  const events = await generate(!wantGPU);
  if (wantGPU) {
    $('#load-text').textContent = 'Uploading 10M events to a GPU storage buffer…';
    try { GPU = await initGPU(events); } catch (err) { console.warn('WebGPU path unavailable:', err && err.message); GPU = null; }
    if (!GPU) { $('#load-text').textContent = 'No WebGPU here: binning on the CPU instead…'; if (worker && worker.terminate) worker.terminate(); await generate(true); }
  }
  $('#loading').remove();
  CTRL.ready = true;
  const t0 = qs.has('t') ? +qs.get('t') : CTRL.pendingSeek != null ? CTRL.pendingSeek : RM ? POSTER_T : 0;
  if (qs.has('t') || CTRL.pendingSeek != null || RM) window.__seek(t0); else { seekCore(0); schedule(); }
  window.__ready = true;
} catch (err) {
  console.error(err); $('#load-text').textContent = 'Could not build the density view: ' + (err && err.message || err);
}
</script>
</body>
</html>
